<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{background:#f8fafc;color:#0f172a;font-family:"Noto Sans JP",system-ui,sans-serif}
.top{height:64px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 40px;gap:32px}
.top b{font-size:18px}nav{display:flex;gap:24px;color:#64748b;font-size:15px}nav .on{color:#2563eb;font-weight:500}
main{display:flex;flex-direction:column;align-items:center;padding-top:48px}
.prog{width:640px;height:8px;background:#e2e8f0;border-radius:99px;margin-bottom:12px}.prog i{display:block;width:60%;height:100%;background:#2563eb;border-radius:99px}
.lab{width:640px;display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:28px}
.card{width:640px;height:400px;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(15,23,42,.08);display:flex;align-items:center;justify-content:center;font-size:240px;font-weight:500}
.opts{display:flex;gap:16px;margin-top:28px}
.opt{width:200px;height:64px;border-radius:12px;background:#fff;border:1px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:22px}
</style></head><body>
<header class="top"><b>Kana Dojo</b><nav><span class="on">Learn</span><span>Recall</span><span>Mix</span><span>Type</span><span>Stats</span></nav></header>
<main><div class="prog"><i></i></div><div class="lab"><span>Sa row · Quiz</span><span>3 / 5 in a row</span></div>
<div class="card">そ</div><div class="opts"><div class="opt">so</div><div class="opt">shi</div><div class="opt">tsu</div></div></main>
