<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kana Specimen</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Noto+Sans+JP:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{background:#fafaf9;color:#111;font-family:"Noto Sans JP",sans-serif}
.top{height:52px;display:flex;align-items:center;padding:0 40px;gap:32px;font-size:14px;border-bottom:1px solid #111}
.top b{font-weight:500}.sp{flex:1}
nav{display:flex;gap:22px;color:#777}nav .on{color:#111}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
main{display:grid;grid-template-columns:1fr 340px;height:520px;border-bottom:1px solid #111}
.glyph{display:flex;align-items:center;justify-content:center;border-right:1px solid #111;position:relative}
.glyph span{font-family:"Klee One";font-size:440px;font-weight:600;line-height:1}
.glyph .mono{position:absolute;left:24px;top:20px;color:#777}
.side{padding:24px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding-bottom:8px}
.opt{border:1px solid #111;height:56px;display:flex;align-items:center;padding:0 16px;gap:16px;font-size:22px}
.opt .mono{color:#777}
.bar{height:6px;background:#e5e5e3;position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;width:60%;background:#e4002b}
.spec{display:grid;grid-template-columns:repeat(15,1fr);padding:18px 40px;gap:4px}
.spec b{font-family:"Klee One";font-weight:600;font-size:34px;height:58px;display:flex;align-items:center;justify-content:center;border:1px solid #e5e5e3}
.spec b.w{border-color:#e4002b;color:#e4002b}.spec b.u{color:#ccc}
</style></head><body>
<header class="top"><b>Kana Dojo</b><nav><span class="on">Learn</span><span>Recall</span><span>Mix</span><span>Type</span><span>Stats</span></nav><div class="sp"></div><span class="mono">Hiragana / Katakana</span></header>
<main><div class="glyph"><span class="mono">L0 · SA ROW · QUIZ</span><span>そ</span></div>
<div class="side"><div class="row mono"><span>Streak</span><span>3 / 5</span></div><div class="bar"><i></i></div>
<div class="row mono"><span>Attempts</span><span>12</span></div><div class="row mono"><span>Accuracy</span><span>67%</span></div>
<div class="opt"><span class="mono">1</span>so</div><div class="opt"><span class="mono">2</span>shi</div><div class="opt"><span class="mono">3</span>tsu</div></div></main>
<section class="spec">
<b>あ</b><b>い</b><b>う</b><b>え</b><b>お</b><b>か</b><b class="w">き</b><b>く</b><b>け</b><b>こ</b><b>さ</b><b class="w">し</b><b>す</b><b>せ</b><b class="w">そ</b>
<b class="u">た</b><b class="u">ち</b><b class="u">つ</b><b class="u">て</b><b class="u">と</b><b class="u">な</b><b class="u">に</b><b class="u">ぬ</b><b class="u">ね</b><b class="u">の</b><b class="u">は</b><b class="u">ひ</b><b class="u">ふ</b><b class="u">へ</b><b class="u">ほ</b>
<b class="u">ま</b><b class="u">み</b><b class="u">む</b><b class="u">め</b><b class="u">も</b><b class="u">や</b><b class="u">ゆ</b><b class="u">よ</b><b class="u">ら</b><b class="u">り</b><b class="u">る</b><b class="u">れ</b><b class="u">ろ</b><b class="u">わ</b><b class="u">を</b>
</section></body></html>
